name: Daily update & deploy

# The automation backbone. Runs every day, refreshes data, rebuilds the whole
# site, commits, and (via Pages/Vercel) redeploys. $0 on GitHub free tier.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch: {}    # manual "Run" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh data
        run: node scripts/update.mjs
      - name: Rebuild site
        run: node scripts/build.mjs
      - name: Commit if changed
        run: |
          git config user.name "aipriceindex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: daily data refresh $(date -u +%F)"
          git push
