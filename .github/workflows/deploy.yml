# Auto-deploy to the VPS on every push to main.
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST      e.g. 12.34.56.78
#   VPS_USER      e.g. root (or a deploy user)
#   VPS_SSH_KEY   private key whose public half is in the VPS authorized_keys
#   GUMROAD_PRODUCT_ID   (optional until the Gumroad product exists)
name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            mkdir -p /opt/aipricetable
            if [ ! -d /opt/aipricetable/.git ]; then
              git clone https://github.com/${{ github.repository }}.git /opt/aipricetable
            fi
            cd /opt/aipricetable
            git fetch origin main
            git reset --hard origin/main
            export GUMROAD_PRODUCT_ID="${{ secrets.GUMROAD_PRODUCT_ID }}"
            docker compose -f deploy/docker-compose.yml up -d --build
            docker image prune -f
