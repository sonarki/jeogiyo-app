<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>*{margin:0;padding:0}body{width:1500px;height:500px;overflow:hidden}</style></head>
<body>
<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hookGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF5C1F"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD97A"/>
      <stop offset="1" stop-color="#FFB53E"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5C1F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF5C1F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5C1F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="500" fill="#111318"/>

  <!-- subtle diagonal streaks -->
  <g transform="rotate(-18 750 250)">
    <rect x="80" y="120" width="1500" height="7" fill="url(#streak)"/>
    <rect x="-140" y="300" width="1500" height="5" fill="url(#streak)" opacity="0.7"/>
    <rect x="220" y="420" width="1300" height="4" fill="url(#streak)" opacity="0.5"/>
  </g>

  <!-- mark: sweeping hook + coins, left side -->
  <g transform="translate(45,40) scale(0.41)">
    <g fill="none" stroke="#FF8A3D" stroke-linecap="round" opacity="0.45">
      <path d="M155 170 Q 165 360 395 480" stroke-width="13"/>
    </g>
    <g transform="rotate(-30 512 570)">
      <g fill="none" stroke="url(#hookGrad)" stroke-width="60" stroke-linecap="round">
        <circle cx="655" cy="250" r="30" stroke-width="36"/>
        <path d="M655 300 L655 590 A178 178 0 1 1 318 528"/>
        <path d="M318 528 L372 578" stroke-width="48"/>
      </g>
    </g>
    <g transform="rotate(14 185 245)">
      <circle cx="185" cy="245" r="50" fill="url(#coinGrad)" stroke="#B87514" stroke-width="6"/>
      <text x="185" y="268" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="62" fill="#8A5A0E">$</text>
    </g>
    <g transform="rotate(-9 300 330)">
      <circle cx="300" cy="330" r="64" fill="url(#coinGrad)" stroke="#B87514" stroke-width="7"/>
      <text x="300" y="358" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="80" fill="#8A5A0E">$</text>
    </g>
    <g transform="rotate(8 415 475)">
      <circle cx="415" cy="475" r="80" fill="url(#coinGrad)" stroke="#B87514" stroke-width="8"/>
      <text x="415" y="510" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="100" fill="#8A5A0E">$</text>
    </g>
  </g>

  <!-- wordmark -->
  <text x="520" y="268" font-family="DejaVu Sans" font-weight="bold" font-size="118" fill="#FFFFFF" letter-spacing="10">HOOKFORGE</text>
  <text x="526" y="345" font-family="DejaVu Sans" font-weight="bold" font-size="34" fill="#FF8A3D" letter-spacing="7">AI UGC ADS · 48-HOUR DELIVERY</text>
</svg>
</body></html>
